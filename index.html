<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d15" />
    <title>MOGGMAN — Твой выход</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2307040f'/%3E%3Crect x='4' y='2' width='8' height='8' fill='%23e8b48a'/%3E%3Crect x='4' y='1' width='8' height='3' fill='%238a5a2b'/%3E%3Crect x='4' y='10' width='8' height='5' fill='%23b06cff'/%3E%3C/svg%3E" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <div id="hud" hidden>
        <div class="hrow">
          <div class="who"><b id="h-who"></b> <span id="h-lv" class="gold"></span><div class="xpbar"><i id="h-xp"></i></div></div>
          <span class="chip"><i class="coin"></i><span id="h-coins">0</span></span>
          <span class="chip heart" id="h-lives"></span>
          <span class="chip" id="h-bp"></span>
        </div>
        <div class="hrow">
          <span id="h-level"></span>
          <div class="who"><div class="bar pink"><i id="h-pctbar"></i></div></div>
          <span id="h-pct"></span>
          <span><span id="h-score">0</span> <span class="mult" id="h-mult"></span></span>
          <button class="pbtn" id="btn-pause" aria-label="Pause">II</button>
        </div>
        <div class="aura-row"><span id="h-aura">AURA 0/40</span><div class="aura-meter"><i id="aura-fill"></i></div></div>
        <div class="hrow" id="hud-boss" hidden><span id="h-bossname"></span><div class="who bar red"><i id="h-bosshp"></i></div></div>
        <div id="hud-bonus" hidden></div>
      </div>
      <div id="stage"><div id="game"></div></div>
      <div id="controls" hidden>
        <div id="dpad">
          <button class="u" data-d="u" aria-label="Up">&#9650;</button>
          <button class="l" data-d="l" aria-label="Left">&#9664;</button>
          <button class="r" data-d="r" aria-label="Right">&#9654;</button>
          <button class="d" data-d="d" aria-label="Down">&#9660;</button>
        </div>
        <div id="actions">
          <button class="ibtn" id="btn-energy">BOOST<br /><b>0</b></button>
          <button class="ibtn" id="btn-shield">SHIELD<br /><b>0</b></button>
          <button class="abtn" id="btn-ability"><span class="nm"></span><span class="cd"></span></button>
        </div>
      </div>
      <div id="screen" hidden></div>
      <div id="modal" hidden></div>
      <div id="toast" hidden></div>
      <div id="flash" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
